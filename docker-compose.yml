name: sicam-front

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3333}
    container_name: sicam-front
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5173"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
